<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Burrow</title>
  <!-- A lowercase b in heavy box-drawing strokes, with the magenta block
       cursor in its bowl. Every edge sits on an even unit, so it stays
       sharp at 16 and 32 px. -->
  <rect width="32" height="32" fill="#0a0a0a"/>
  <path fill="#f3f3ec" d="M6 4h4v6h16v18H6z M10 14v10h12V14z" fill-rule="evenodd"/>
  <rect x="14" y="16" width="4" height="6" fill="#e07fd0"/>
</svg>
